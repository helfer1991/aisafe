spring.application.name=aisafe
spring.profiles.active=dev
spring.jpa.open-in-view=false
aisafe.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
aisafe.jwt.access-token-ttl=15m
aisafe.jwt.refresh-token-ttl=7d
aisafe.jwt.issuer=aisafe
aisafe.email.allowed-domains=${ALLOWED_EMAIL_DOMAINS:aisafe.com,isep.ipp.pt,faa.gov,eurocontrol.int,tap.pt}